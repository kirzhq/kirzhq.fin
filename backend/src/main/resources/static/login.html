<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Вход — Мои финансы</title>
  <link rel="stylesheet" href="/login.css">
  <script src="/login-passkey.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand" aria-hidden="true">₽</div>
      <p class="eyebrow">Личное пространство</p>
      <h1 id="login-title">Мои финансы</h1>
      <p class="intro">Доходы, расходы и автомобиль — только для вас.</p>

      <div id="error-message" class="notice notice-error" hidden>
        Не удалось войти. Попробуйте ещё раз.
      </div>

      <button id="passkey-signin" class="passkey-button" type="button">
        <span class="touch-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M12 3a7 7 0 0 0-7 7v2m14 0v-2a7 7 0 0 0-3.1-5.8M8 20c-2-2.4-3-5-3-8m11 8c2-2.4 3-5 3-8M9 7.8A4 4 0 0 1 16 10v2.5c0 2.6-.8 5.1-2.3 7.2M9 12v1.5c0 2 .6 4 1.8 5.6M12 10v3.5c0 1.2.3 2.4.8 3.5"/>
          </svg>
        </span>
        <span>
          <strong>Войти с Touch ID</strong>
          <small>Быстро и безопасно</small>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>

      <p id="passkey-status" class="status" aria-live="polite"></p>

      <details class="password-panel">
        <summary>Войти по временному паролю</summary>
        <form method="post" action="/login" id="password-form">
          <label>
            Имя пользователя
            <input name="username" autocomplete="username webauthn" required>
          </label>
          <label>
            Пароль
            <input type="password" name="password" autocomplete="current-password" required>
          </label>
          <input type="hidden" name="_csrf" id="csrf-field">
          <button class="password-button" type="submit">Войти</button>
        </form>
      </details>

      <p class="privacy">Ключ Touch ID остаётся на вашем устройстве.</p>
    </section>
  </main>
</body>
</html>
