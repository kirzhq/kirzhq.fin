spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finance_tracker}
    username: ${DATABASE_USER:finance}
    password: ${DATABASE_PASSWORD:finance}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 30d

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: KIRZHQ_SESSION
        domain: ${SESSION_COOKIE_DOMAIN:localhost}
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
  telegram:
    token: ${TELEGRAM_BOT_TOKEN:}
    allowed-chat-id: ${TELEGRAM_ALLOWED_CHAT_ID:}
